version: '3.9'

services:
  db:
    image: timescale/timescaledb:latest-pg15
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-vantage}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-vantage}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-vantage}']
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: unless-stopped
    ports:
      - '3001:3001'
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${DB_USER:-vantage}:${DB_PASSWORD}@db:5432/${DB_NAME:-vantage}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET}
      SSH_ENCRYPTION_KEY: ${SSH_ENCRYPTION_KEY}
      AGENT_SIGNING_SECRET: ${AGENT_SIGNING_SECRET}
      CRON_SECRET: ${CRON_SECRET}
      MAIL_ENCRYPTION_KEY: ${MAIL_ENCRYPTION_KEY}
      APP_URL: http://${VM_IP:-localhost}:3000
      PORT: 3001
      COOKIE_SECURE: 'false'
      CONFIG_PATH: /app/vantage.config.json
    volumes:
      - ./vantage.config.json:/app/vantage.config.json:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${DB_USER:-vantage}:${DB_PASSWORD}@db:5432/${DB_NAME:-vantage}
      REDIS_URL: redis://redis:6379
      API_URL: http://api:3001
      JWT_SECRET: ${JWT_SECRET}
      CRON_SECRET: ${CRON_SECRET}
      SSH_ENCRYPTION_KEY: ${SSH_ENCRYPTION_KEY}
      CONFIG_PATH: /app/vantage.config.json
    volumes:
      - ./vantage.config.json:/app/vantage.config.json:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_started

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        NEXT_PUBLIC_APP_URL: http://${VM_IP:-localhost}:3000
        NEXT_PUBLIC_API_URL: http://api:3001
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: production
    depends_on:
      - api

volumes:
  pgdata:
  redisdata:
