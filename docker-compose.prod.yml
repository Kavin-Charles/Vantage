# docker-compose.prod.yml
# Reference production compose file.
# Usage: copy .env.example to .env, fill in secrets, then:
#   docker compose -f docker-compose.prod.yml up -d
services:
  web:
    image: ghcr.io/vencorehq/vencore-web:${VENCORE_VERSION:-latest}
    ports:
      - "80:3000"
    env_file: .env
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  api:
    image: ghcr.io/vencorehq/vencore-api:${VENCORE_VERSION:-latest}
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/api/setup/status || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  worker:
    image: ghcr.io/vencorehq/vencore-worker:${VENCORE_VERSION:-latest}
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  updater:
    image: ghcr.io/vencorehq/vencore-updater:${VENCORE_VERSION:-latest}
    env_file: .env
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - .:/vencore
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: vencore
      POSTGRES_PASSWORD: vencore
      POSTGRES_DB: vencore
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vencore"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  db_data:
  redis_data:
