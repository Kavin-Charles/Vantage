name: Deploy Demo

on:
  push:
    branches: [demo]

env:
  REGISTRY: ghcr.io
  ORG: vencorehq
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GCP_ZONE: ${{ secrets.GCP_ZONE }}
  VM_NAME: vencore-demo

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: true
      matrix:
        include:
          - image: vencore-web
            dockerfile: Dockerfile.web
          - image: vencore-api
            dockerfile: Dockerfile.api
          - image: vencore-worker
            dockerfile: Dockerfile.worker

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.ORG }}/${{ matrix.image }}
          tags: |
            type=raw,value=demo

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push ${{ matrix.image }}
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=demo-${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=demo-${{ matrix.image }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Checkout (for compose file)
        uses: actions/checkout@v4

      - name: Copy compose file to VM
        run: |
          gcloud compute scp docker-compose.demo.yml ${{ env.VM_NAME }}:~/vencore/docker-compose.yml \
            --project=${{ env.GCP_PROJECT_ID }} \
            --zone=${{ env.GCP_ZONE }}

      - name: Deploy to VM
        run: |
          gcloud compute ssh ${{ env.VM_NAME }} \
            --project=${{ env.GCP_PROJECT_ID }} \
            --zone=${{ env.GCP_ZONE }} \
            --command="
              set -e

              echo '🔄 Pulling latest demo images...'
              docker pull ghcr.io/vencorehq/vencore-web:demo
              docker pull ghcr.io/vencorehq/vencore-api:demo
              docker pull ghcr.io/vencorehq/vencore-worker:demo

              echo '🚀 Restarting services...'
              cd ~/vencore
              docker compose down
              docker compose up -d

              echo '⏳ Waiting for API health check...'
              for i in \$(seq 1 30); do
                if docker compose exec -T api wget -qO- http://localhost:3001/api/setup/status > /dev/null 2>&1; then
                  echo '✅ Demo deployment complete!'
                  exit 0
                fi
                sleep 3
              done

              echo '❌ API health check timed out'
              docker compose logs --tail=50 api
              exit 1
            "
