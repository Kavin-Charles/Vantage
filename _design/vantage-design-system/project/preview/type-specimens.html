<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Type In Use</title>
<link rel="stylesheet" href="_card.css"><style></style></head>
<body><div class="card">
<div style="display:flex;flex-direction:column;gap:16px">
  <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px">
    
    <div style="background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:14px 16px">
      <div style="font-size:10px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:1.4px;margin-bottom:8px">Total Revenue</div>
      <div style="font-family:var(--font-display);font-size:26px;font-weight:600;letter-spacing:-0.6px;color:var(--text);line-height:1.05">$33.6K</div>
    </div>
    <div style="background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:14px 16px">
      <div style="font-size:10px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:1.4px;margin-bottom:8px">Win Rate</div>
      <div style="font-family:var(--font-display);font-size:26px;font-weight:600;letter-spacing:-0.6px;color:var(--text);line-height:1.05">67%</div>
    </div>
    <div style="background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:14px 16px">
      <div style="font-size:10px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:1.4px;margin-bottom:8px">Deals Won</div>
      <div style="font-family:var(--font-display);font-size:26px;font-weight:600;letter-spacing:-0.6px;color:var(--text);line-height:1.05">2</div>
    </div>
  </div>
  <div style="display:flex;align-items:center;gap:14px;padding:14px 18px;background:var(--surface);border:1px solid var(--border);border-radius:16px">
    <span style="font-family:var(--font-display);font-size:20px;font-weight:500;letter-spacing:-0.4px;color:var(--text)">Analytics</span>
    <span style="font:600 10px var(--font-sans);color:var(--text3);text-transform:uppercase;letter-spacing:1.4px">— page title in topbar</span>
  </div>
</div></div></body></html>
