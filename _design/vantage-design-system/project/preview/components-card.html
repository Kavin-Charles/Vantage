<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Kanban Card</title>
<link rel="stylesheet" href="_card.css"><style></style></head>
<body><div class="card"><div style="display:grid;grid-template-columns:1fr 1fr;gap:14px">
    <div style="background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:12px 14px">
      <div style="font:500 13px var(--font-sans);margin-bottom:6px">Cobalt — Infra Add-on</div>
      <div style="display:flex;align-items:center;justify-content:space-between"><span style="font-size:13px">$12,000</span><span style="font-size:11px;color:var(--text3)">65%</span></div>
      <div style="font-size:11px;color:var(--text3);margin-top:6px">Close 5/27/2026</div>
    </div>
    <div style="background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:12px 14px;box-shadow:0 2px 8px rgba(0,0,0,.08);cursor:grab">
      <div style="font:500 13px var(--font-sans);margin-bottom:6px">Orbit Cloud — Platform</div>
      <div style="display:flex;align-items:center;justify-content:space-between"><span style="font-size:13px">$36,000</span><span style="font-size:11px;color:var(--text3)">85%</span></div>
      <div style="font-size:11px;color:var(--text3);margin-top:6px">Close 5/20/2026</div>
    </div>
  </div>
  <div style="display:flex;gap:18px;font-size:11px;color:var(--text3)">
    <span><b style="color:var(--text)">rest</b> · no shadow</span>
    <span><b style="color:var(--text)">hover</b> · 0 2 8 rgba(0,0,0,.08) · cursor: grab</span>
  </div></div></body></html>
