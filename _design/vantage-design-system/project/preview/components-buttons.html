<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Buttons</title>
<link rel="stylesheet" href="_card.css"><style></style></head>
<body><div class="card"><div style="display:flex;flex-direction:column;gap:14px">
    <div class="row" style="gap:10px">
      <button style="background:var(--text);color:#fff;border:1px solid var(--text);border-radius:8px;padding:7px 14px;font:500 13px var(--font-sans);cursor:pointer">+ Add item</button>
      <button style="background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:7px 14px;font:500 13px var(--font-sans);cursor:pointer">Import CSV</button>
      <button style="background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:7px 14px;font:500 13px var(--font-sans);cursor:pointer">Export CSV</button>
      <button style="background:var(--red-bg);color:var(--red);border:1px solid var(--red-bg);border-radius:8px;padding:7px 14px;font:500 13px var(--font-sans);cursor:pointer">Delete</button>
    </div>
    <div class="row" style="gap:10px">
      <span class="eyebrow">Primary</span><span style="font-family:var(--font-mono);font-size:11px;color:var(--text3)">--text bg · #fff fg · 13/500 · 7×14 · r8</span>
    </div>
    <div class="row" style="gap:10px">
      <span class="eyebrow">Secondary</span><span style="font-family:var(--font-mono);font-size:11px;color:var(--text3)">--surface · --text · --border 1px</span>
    </div>
    <div class="row" style="gap:10px">
      <span class="eyebrow">Danger</span><span style="font-family:var(--font-mono);font-size:11px;color:var(--text3)">--red-bg fill · --red text</span>
    </div>
    <div class="row" style="gap:10px;border-top:1px dashed var(--border);padding-top:12px">
      <button disabled style="background:var(--text);color:#fff;border:1px solid var(--text);border-radius:8px;padding:7px 14px;font:500 13px var(--font-sans);opacity:.6;cursor:not-allowed">Signing in…</button>
      <button style="background:var(--surface);color:var(--text2);border:1px solid var(--border);border-radius:7px;padding:7px 14px;font:500 13px var(--font-sans);cursor:pointer">Edit</button>
      <span style="font-size:11px;color:var(--text3)">disabled · table-row inline</span>
    </div>
  </div></div></body></html>
