<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Shadows</title>
<link rel="stylesheet" href="_card.css"><style></style></head>
<body><div class="card">
<div style="display:grid;grid-template-columns:1fr 1fr;gap:18px;padding:6px 0">
  <div style="display:flex;flex-direction:column;gap:12px;align-items:center">
    <div style="background:var(--surface);border:1px solid var(--border);border-radius:12px;width:220px;height:96px;box-shadow:0 2px 8px rgba(0,0,0,0.08);padding:14px 16px">
      <div style="font:500 13px var(--font-sans);margin-bottom:6px;color:var(--text)">Cobalt — Enterprise</div>
      <div style="font:13px var(--font-sans);color:var(--text)">$55,000</div>
    </div>
    <div style="text-align:center">
      <div style="font-family:var(--font-mono);font-size:11px;color:var(--text)">0 2 8 rgba(0,0,0,.08)</div>
      <div style="font-size:11px;color:var(--text3);margin-top:2px">kanban card hover lift</div>
    </div>
  </div>
  <div style="display:flex;flex-direction:column;gap:12px;align-items:center">
    <div style="background:var(--surface);border:1px solid var(--border);border-radius:20px;width:220px;height:96px;box-shadow:0 8px 32px rgba(0,0,0,0.12);padding:14px 16px">
      <div style="font:600 14px var(--font-sans);color:var(--text)">Add contact</div>
      <div style="font-size:11px;color:var(--text3);margin-top:4px">modal · centered</div>
    </div>
    <div style="text-align:center">
      <div style="font-family:var(--font-mono);font-size:11px;color:var(--text)">0 8 32 rgba(0,0,0,.12)</div>
      <div style="font-size:11px;color:var(--text3);margin-top:2px">modal overlay</div>
    </div>
  </div>
</div>
<div style="font-size:11px;color:var(--text3);font-style:italic;margin-top:4px">All other "elevation" is done with 1px borders, not shadow.</div></div></body></html>
