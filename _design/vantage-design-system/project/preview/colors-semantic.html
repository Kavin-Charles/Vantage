<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Semantic Pairs</title>
<link rel="stylesheet" href="_card.css">
<style></style>
</head>
<body>
<div class="card">
<div class="grid" style="grid-template-columns:repeat(2,1fr)">
    
  <div style="border:1px solid var(--border);border-radius:8px;overflow:hidden">
    <div style="background:#d8f3dc;color:#2d6a4f;padding:12px 14px;display:flex;align-items:center;justify-content:space-between">
      <span style="font-weight:600;font-size:12px">Green</span>
      <span style="font-family:var(--font-mono);font-size:10.5px;opacity:.8">#2D6A4F / #D8F3DC</span>
    </div>
    <div style="padding:8px 14px;background:var(--surface);display:flex;gap:8px;align-items:center">
      <span style="background:#d8f3dc;color:#2d6a4f;font-size:11px;font-weight:600;padding:2px 8px;border-radius:20px">green</span>
      <span style="font-size:11px;color:var(--text3)">badge example</span>
    </div>
  </div>
    
  <div style="border:1px solid var(--border);border-radius:8px;overflow:hidden">
    <div style="background:#fef3c7;color:#92400e;padding:12px 14px;display:flex;align-items:center;justify-content:space-between">
      <span style="font-weight:600;font-size:12px">Amber</span>
      <span style="font-family:var(--font-mono);font-size:10.5px;opacity:.8">#92400E / #FEF3C7</span>
    </div>
    <div style="padding:8px 14px;background:var(--surface);display:flex;gap:8px;align-items:center">
      <span style="background:#fef3c7;color:#92400e;font-size:11px;font-weight:600;padding:2px 8px;border-radius:20px">amber</span>
      <span style="font-size:11px;color:var(--text3)">badge example</span>
    </div>
  </div>
    
  <div style="border:1px solid var(--border);border-radius:8px;overflow:hidden">
    <div style="background:#fee2e2;color:#991b1b;padding:12px 14px;display:flex;align-items:center;justify-content:space-between">
      <span style="font-weight:600;font-size:12px">Red</span>
      <span style="font-family:var(--font-mono);font-size:10.5px;opacity:.8">#991B1B / #FEE2E2</span>
    </div>
    <div style="padding:8px 14px;background:var(--surface);display:flex;gap:8px;align-items:center">
      <span style="background:#fee2e2;color:#991b1b;font-size:11px;font-weight:600;padding:2px 8px;border-radius:20px">red</span>
      <span style="font-size:11px;color:var(--text3)">badge example</span>
    </div>
  </div>
    
  <div style="border:1px solid var(--border);border-radius:8px;overflow:hidden">
    <div style="background:#dbeafe;color:#1e3a8a;padding:12px 14px;display:flex;align-items:center;justify-content:space-between">
      <span style="font-weight:600;font-size:12px">Blue</span>
      <span style="font-family:var(--font-mono);font-size:10.5px;opacity:.8">#1E3A8A / #DBEAFE</span>
    </div>
    <div style="padding:8px 14px;background:var(--surface);display:flex;gap:8px;align-items:center">
      <span style="background:#dbeafe;color:#1e3a8a;font-size:11px;font-weight:600;padding:2px 8px;border-radius:20px">blue</span>
      <span style="font-size:11px;color:var(--text3)">badge example</span>
    </div>
  </div>
    
  <div style="border:1px solid var(--border);border-radius:8px;overflow:hidden">
    <div style="background:#ede9fe;color:#4c1d95;padding:12px 14px;display:flex;align-items:center;justify-content:space-between">
      <span style="font-weight:600;font-size:12px">Purple</span>
      <span style="font-family:var(--font-mono);font-size:10.5px;opacity:.8">#4C1D95 / #EDE9FE</span>
    </div>
    <div style="padding:8px 14px;background:var(--surface);display:flex;gap:8px;align-items:center">
      <span style="background:#ede9fe;color:#4c1d95;font-size:11px;font-weight:600;padding:2px 8px;border-radius:20px">purple</span>
      <span style="font-size:11px;color:var(--text3)">badge example</span>
    </div>
  </div>
    
  <div style="border:1px solid var(--border);border-radius:8px;overflow:hidden">
    <div style="background:#f0ede6;color:#6b665c;padding:12px 14px;display:flex;align-items:center;justify-content:space-between">
      <span style="font-weight:600;font-size:12px">Gray</span>
      <span style="font-family:var(--font-mono);font-size:10.5px;opacity:.8">#6B665C / #F0EDE6</span>
    </div>
    <div style="padding:8px 14px;background:var(--surface);display:flex;gap:8px;align-items:center">
      <span style="background:#f0ede6;color:#6b665c;font-size:11px;font-weight:600;padding:2px 8px;border-radius:20px">gray</span>
      <span style="font-size:11px;color:var(--text3)">badge example</span>
    </div>
  </div>
  </div>
</div>
</body>
</html>
