<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Spacing Scale</title>
<link rel="stylesheet" href="_card.css"><style></style></head>
<body><div class="card">
<div style="display:flex;flex-direction:column;gap:8px">
  
    <div style="display:flex;align-items:center;gap:14px">
      <span style="font-family:var(--font-mono);font-size:11px;color:var(--text3);width:44px;text-align:right">2px</span>
      <span style="display:inline-block;height:14px;background:var(--text);border-radius:4px;width:6px"></span>
      <span style="font-size:11px;color:var(--text3)">pill chip Y</span>
    </div>
    <div style="display:flex;align-items:center;gap:14px">
      <span style="font-family:var(--font-mono);font-size:11px;color:var(--text3);width:44px;text-align:right">4px</span>
      <span style="display:inline-block;height:14px;background:var(--text);border-radius:4px;width:12px"></span>
      <span style="font-size:11px;color:var(--text3)">badge gap</span>
    </div>
    <div style="display:flex;align-items:center;gap:14px">
      <span style="font-family:var(--font-mono);font-size:11px;color:var(--text3);width:44px;text-align:right">6px</span>
      <span style="display:inline-block;height:14px;background:var(--text);border-radius:4px;width:18px"></span>
      <span style="font-size:11px;color:var(--text3)">sidebar label spacing</span>
    </div>
    <div style="display:flex;align-items:center;gap:14px">
      <span style="font-family:var(--font-mono);font-size:11px;color:var(--text3);width:44px;text-align:right">8px</span>
      <span style="display:inline-block;height:14px;background:var(--text);border-radius:4px;width:24px"></span>
      <span style="font-size:11px;color:var(--text3)">tight stack</span>
    </div>
    <div style="display:flex;align-items:center;gap:14px">
      <span style="font-family:var(--font-mono);font-size:11px;color:var(--text3);width:44px;text-align:right">12px</span>
      <span style="display:inline-block;height:14px;background:var(--text);border-radius:4px;width:36px"></span>
      <span style="font-size:11px;color:var(--text3)">page section gap</span>
    </div>
    <div style="display:flex;align-items:center;gap:14px">
      <span style="font-family:var(--font-mono);font-size:11px;color:var(--text3);width:44px;text-align:right">14px</span>
      <span style="display:inline-block;height:14px;background:var(--text);border-radius:4px;width:42px"></span>
      <span style="font-size:11px;color:var(--text3)">card body padding</span>
    </div>
    <div style="display:flex;align-items:center;gap:14px">
      <span style="font-family:var(--font-mono);font-size:11px;color:var(--text3);width:44px;text-align:right">16px</span>
      <span style="display:inline-block;height:14px;background:var(--text);border-radius:4px;width:48px"></span>
      <span style="font-size:11px;color:var(--text3)">KPI card padding Y</span>
    </div>
    <div style="display:flex;align-items:center;gap:14px">
      <span style="font-family:var(--font-mono);font-size:11px;color:var(--text3);width:44px;text-align:right">20px</span>
      <span style="display:inline-block;height:14px;background:var(--text);border-radius:4px;width:60px"></span>
      <span style="font-size:11px;color:var(--text3)">modal padding · card padding X</span>
    </div>
    <div style="display:flex;align-items:center;gap:14px">
      <span style="font-family:var(--font-mono);font-size:11px;color:var(--text3);width:44px;text-align:right">24px</span>
      <span style="display:inline-block;height:14px;background:var(--text);border-radius:4px;width:72px"></span>
      <span style="font-size:11px;color:var(--text3)">page padding</span>
    </div>
    <div style="display:flex;align-items:center;gap:14px">
      <span style="font-family:var(--font-mono);font-size:11px;color:var(--text3);width:44px;text-align:right">32px</span>
      <span style="display:inline-block;height:14px;background:var(--text);border-radius:4px;width:96px"></span>
      <span style="font-size:11px;color:var(--text3)">-</span>
    </div>
</div></div></body></html>
