<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Modal</title>
<link rel="stylesheet" href="_card.css"><style></style></head>
<body><div class="card"><div style="background:rgba(0,0,0,.3);border-radius:10px;padding:24px;display:flex;align-items:center;justify-content:center">
    <div style="background:var(--surface);border:1px solid var(--border);border-radius:12px;width:380px;box-shadow:0 8px 32px rgba(0,0,0,.12);overflow:hidden">
      <div style="padding:16px 20px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between">
        <span style="font:600 15px var(--font-sans)">Log activity</span>
        <span style="color:var(--text3);font-size:18px;line-height:1">×</span>
      </div>
      <div style="padding:18px 20px">
        <label style="display:block;font:600 12px var(--font-sans);color:var(--text2);margin-bottom:6px">Type</label>
        <select style="width:100%;padding:8px 12px;border-radius:8px;border:1px solid var(--border);background:var(--bg);font:14px var(--font-sans);color:var(--text);margin-bottom:14px"><option>Note</option></select>
        <div style="display:flex;gap:8px;justify-content:flex-end">
          <button style="background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:6px 12px;font:500 13px var(--font-sans)">Cancel</button>
          <button style="background:var(--text);color:#fff;border:1px solid var(--text);border-radius:8px;padding:6px 12px;font:500 13px var(--font-sans)">Log</button>
        </div>
      </div>
    </div>
  </div></div></body></html>
