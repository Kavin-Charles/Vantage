<title>Vantage — Mobile</title>

<link rel="stylesheet" href="../../colors_and_type.css" />

<style>
  /* Page chrome — sits under the design canvas */
  html, body { height: 100%; margin: 0; }
  body {
    background: #ece9e0;
    overscroll-behavior: none;
    font-family: var(--font-sans);
    color: var(--text);
  }

  /* Cross-platform mobile content typography — keep it tighter than the web kit,
     but use the same families.  ~15px body baseline reads at phone arm length. */
  .vt-mobile {
    font-family: var(--font-sans);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  .vt-mobile *::-webkit-scrollbar { width: 0; height: 0; }

  /* Bricolage display class used in headers / KPIs */
  .vt-display {
    font-family: var(--font-display);
    letter-spacing: -0.4px;
    font-weight: 600;
  }

  /* Pulse for the alert dot — matches desktop kit */
  @keyframes vt-pulse {
    0%   { transform: scale(.8); opacity: .6; }
    100% { transform: scale(1.9); opacity: 0; }
  }
  .vt-pulse-ring {
    position: absolute; inset: -3px; border-radius: 999px;
    background: var(--red); opacity: 0.35;
    animation: vt-pulse 1.6s ease-out infinite;
    pointer-events: none;
  }

  /* Tap row press feedback — works in both frames */
  .vt-press { transition: background-color .12s ease; cursor: pointer; }
  .vt-press:active { background-color: var(--surface2); }

  /* Hide native scrollbars but keep scroll */
  .vt-scroll { overflow-y: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none; }

  /* Sparkline path stroke uses currentColor */
  .vt-spark path { fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
  .vt-spark .fill { fill: currentColor; opacity: .12; stroke: none; }

  /* ── Dark theme — overrides --bg / --surface / etc inside .vt-dark ──
     Parchment system swapped for "deep ink" backgrounds + warm off-white text. */
  .vt-dark {
    --bg:        #0c1024;
    --surface:   #161b35;
    --surface2:  #1f2545;
    --border:    #262d4f;
    --border2:   #3b4374;
    --text:      #ece9e0;
    --text2:     #a4abc7;
    --text3:     #6a7193;

    --green:    #34d399; --green-bg:  rgba(52,211,153,0.16);
    --amber:    #fbbf24; --amber-bg:  rgba(251,191,36,0.16);
    --red:      #f87171; --red-bg:    rgba(248,113,113,0.16);
    --blue:     #60a5fa; --blue-bg:   rgba(96,165,250,0.16);
    --purple:   #c4b5fd; --purple-bg: rgba(196,181,253,0.16);
  }
</style>
