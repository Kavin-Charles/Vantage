<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Vencore — UI Kit</title>
<link rel="icon" href="../../assets/logo-cloud-trimmed.png">
<link rel="stylesheet" href="../../colors_and_type.css">
<style>
  html, body {
    height: 100%;
    overflow: hidden;
  }
  body {
    font-family: var(--font-sans);
    background: var(--bg);
    color: var(--text);
  }

  /* Shared pulse animation used by the alert dot + critical sidebar dot */
  @keyframes vt-pulse {
    0%   { transform: scale(.8); opacity: .45; }
    70%  { transform: scale(1.9); opacity: 0;   }
    100% { transform: scale(1.9); opacity: 0;   }
  }

  /* Scrollbars on the warm bg */
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb {
    background: var(--border2);
    border-radius: 999px;
    border: 2px solid var(--bg);
  }
  ::-webkit-scrollbar-track { background: transparent; }

  /* Make sure links inside nav don't show underline */
  a { text-decoration: none; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="ui.jsx"></script>
<script type="text/babel" src="Shell.jsx"></script>

</html>
